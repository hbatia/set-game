<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>סט · משחק</title>
<meta name="theme-color" content="#F6F2EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="סט">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--page:#F6F2EB;--panel:#FFFFFF;--panel-2:#FFFFFF;--ink:#3B3733;--ink-soft:#8A837C;--line:#E9E2D6;--accent:#7D2CB5;--accent-ink:#FFFFFF}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Heebo',system-ui,sans-serif;
    background:radial-gradient(1100px 640px at 92% -12%, rgba(255,255,255,.55), transparent 60%), var(--page);
    color:var(--ink); height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    padding:clamp(10px,2vw,24px); transition:background .6s ease,color .4s ease; -webkit-font-smoothing:antialiased}
  .wrap{flex:1; display:flex; flex-direction:column; min-height:0; width:100%; max-width:1120px; margin:0 auto}

  header.top{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:12px; flex:0 0 auto}
  .brand{display:flex; align-items:baseline; gap:12px}
  .brand h1{font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:clamp(30px,5vw,50px); line-height:.9}
  .brand .sub{color:var(--ink-soft); font-size:13.5px}
  @media(max-width:620px){ .brand .sub{display:none} }
  .stats{display:flex; gap:8px; flex-wrap:wrap}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:7px 14px; min-width:70px; text-align:center}
  .stat.hide{display:none}
  .stat .label{font-size:10.5px; color:var(--ink-soft); letter-spacing:1.2px; text-transform:uppercase; margin-bottom:1px}
  .stat .value{font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:21px; font-variant-numeric:tabular-nums}
  .stat.timer .value{color:var(--accent)}
  .stat.best .value{color:#C58A2E}

  .palette-wrap{position:relative; align-self:flex-start; margin-bottom:12px; flex:0 0 auto; z-index:35}
  .pal-toggle{display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-family:'Heebo';
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:9px 15px; font-size:14px; color:var(--ink); transition:transform .12s,box-shadow .2s}
  .pal-toggle:hover{transform:translateY(-1px); box-shadow:0 6px 14px -10px rgba(0,0,0,.35)}
  .pal-toggle .chev{color:var(--ink-soft); font-size:11px; transition:transform .22s}
  .palette-wrap.open .pal-toggle .chev{transform:rotate(180deg)}
  .pal-menu{position:absolute; top:calc(100% + 6px); inset-inline-start:0; min-width:205px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:7px; display:flex; flex-direction:column; gap:4px;
    box-shadow:0 22px 46px -20px rgba(0,0,0,.4); opacity:0; transform:translateY(-6px) scale(.98); transform-origin:top; pointer-events:none; transition:.18s ease}
  .palette-wrap.open .pal-menu{opacity:1; transform:none; pointer-events:auto}
  .dots{display:flex; flex:0 0 auto}
  .dots i{width:14px; height:14px; border-radius:50%; display:block; margin-inline-start:-5px; border:1.5px solid rgba(255,255,255,.8)}
  .dots i:first-child{margin-inline-start:0}
  .pchip{display:flex; align-items:center; gap:10px; cursor:pointer; width:100%; border:1.5px solid transparent; background:transparent;
    border-radius:11px; padding:8px 11px; font-size:14px; color:var(--ink); font-family:'Heebo'; text-align:start; transition:background .15s,border-color .15s}
  .pchip:hover{background:rgba(0,0,0,.04)}
  .pchip.active{border-color:var(--ink)}

  .board{flex:1 1 auto; min-height:0; display:grid; gap:clamp(7px,1.2vw,14px); justify-content:center; align-content:center; margin-bottom:12px; perspective:1100px}
  .card{position:relative; border-radius:14px; background:#fff; border:1.5px solid rgba(60,48,40,.12);
    box-shadow:0 7px 16px -13px rgba(60,45,35,.6); cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:5%;
    transition:transform .14s ease, box-shadow .2s ease; min-height:0}
  .card:hover{transform:translateY(-2px)}
  .card svg{width:100%; height:100%; display:block}
  .card.sel{box-shadow:inset 0 0 0 3px var(--ink), 0 12px 20px -14px rgba(60,45,35,.6); transform:translateY(-3px)}
  .card.matched{animation:matchOut .5s cubic-bezier(.45,0,.55,1) forwards; z-index:5; transform-style:preserve-3d; backface-visibility:hidden}
  .card.enter{animation:cardIn .55s cubic-bezier(.35,0,.3,1) both; transform-style:preserve-3d; backface-visibility:hidden}
  .card.bad{animation:shake .4s ease}
  .card.hint{box-shadow:inset 0 0 0 3px var(--accent); animation:glow 1.1s ease}
  @keyframes matchOut{0%{transform:rotateY(0deg) scale(1)}22%{transform:rotateY(0deg) scale(1.06); box-shadow:inset 0 0 0 3px var(--accent), 0 18px 30px -14px rgba(0,0,0,.5)}100%{transform:rotateY(-90deg) scale(1); opacity:0}}
  @keyframes cardIn{0%{transform:rotateY(90deg) scale(1); opacity:0}55%{opacity:1}100%{transform:rotateY(0deg) scale(1); opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  @keyframes glow{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 3px var(--accent)}}

  /* באזר אישי — צף בשולי הדף, ניתן לגרירה */
  .pbtn{position:fixed; z-index:55; transform:translate(-50%,-50%) rotate(var(--rot,0deg)); overflow:hidden; min-width:116px; border:2px solid var(--line); border-radius:14px;
    padding:9px 14px 11px; cursor:pointer; font-family:'Heebo'; background:var(--panel); color:var(--ink);
    box-shadow:0 9px 22px -12px rgba(0,0,0,.5); transition:box-shadow .2s,opacity .2s; touch-action:none; user-select:none}
  .pinner{display:flex; align-items:center; gap:9px}
  .pbtn .pdot{width:14px; height:14px; border-radius:50%; flex:0 0 auto}
  .pbtn .pname{font-weight:500; font-size:14px; white-space:nowrap; color:var(--ink)}
  .pbtn .pscore{font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:19px; margin-inline-start:auto}
  .pbtn.active{box-shadow:0 0 0 2px currentColor, 0 16px 28px -12px rgba(0,0,0,.55)}
  .pbtn.locked{opacity:.4; pointer-events:none}
  .pbtn.movable{outline:2px dashed currentColor; outline-offset:3px; cursor:grab; animation:pulseGlow .8s ease-in-out infinite}
  @keyframes pulseGlow{0%,100%{box-shadow:0 9px 22px -12px rgba(0,0,0,.5)}50%{box-shadow:0 0 0 4px rgba(120,120,120,.18), 0 9px 22px -12px rgba(0,0,0,.5)}}
  .pbtn .tbar{position:absolute; bottom:0; inset-inline-start:0; height:3px; width:0; background:currentColor; opacity:.6}
  .pbtn.active .tbar{animation:tbar 5s linear forwards}
  @keyframes tbar{from{width:100%}to{width:0}}

  .controls{display:flex; gap:10px; align-items:center; justify-content:center; flex:0 0 auto; flex-wrap:wrap}
  .btn{font-family:'Heebo'; font-size:14.5px; font-weight:500; cursor:pointer; border-radius:13px; padding:11px 20px; border:1.5px solid var(--line);
    background:var(--panel-2); color:var(--ink); transition:transform .12s,box-shadow .2s,background .2s}
  .btn:hover{transform:translateY(-2px); box-shadow:0 8px 16px -12px rgba(0,0,0,.4)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .btn.ghost{background:transparent}
  .btn.ghost:active{background:color-mix(in srgb, var(--accent) 14%, #fff); border-color:var(--accent); color:var(--accent)}
  .btn.soft{background:color-mix(in srgb, var(--accent) 13%, #fff); border-color:var(--accent); color:var(--accent)}
  .btn.start{background:#fff; border-color:var(--line); color:var(--ink)}
  .btn.start:active{background:color-mix(in srgb, var(--accent) 14%, #fff); border-color:var(--accent); color:var(--accent)}
  .nrow input[type=color]{width:30px; height:30px; padding:0; border:1.5px solid var(--line); border-radius:8px; background:none; cursor:pointer; flex:0 0 auto; direction:ltr; unicode-bidi:isolate}
  .nrow input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  .nrow input[type=color]::-webkit-color-swatch{border:none; border-radius:6px}
  .board.blurred{filter:blur(16px); pointer-events:none}
  .board{transition:filter .25s ease}
  #pauseScreen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:65; opacity:0; pointer-events:none; transition:opacity .2s}
  #pauseScreen.show{opacity:1}
  #pauseScreen .btn{pointer-events:auto; font-size:16px; padding:14px 26px}
  .hint-label{text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:9px; flex:0 0 auto}

  .toast{position:fixed; inset-inline:0; bottom:20px; margin-inline:auto; width:max-content; max-width:88vw; background:var(--ink); color:#fff;
    padding:12px 22px; border-radius:40px; font-size:14.5px; box-shadow:0 18px 40px -18px rgba(0,0,0,.5); opacity:0; transform:translateY(14px); pointer-events:none; transition:.3s ease; z-index:80}
  .toast.show{opacity:1; transform:translateY(0)}
  .toast.ok{background:#4E7A54}
  .toast.warn{background:var(--accent)}

  #confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:70; opacity:0; transition:opacity .2s}
  #confetti.on{opacity:1}

  .overlay{position:fixed; inset:0; background:rgba(50,40,34,.46); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:90; opacity:0; pointer-events:none; transition:.3s}
  .overlay.show{opacity:1; pointer-events:auto}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:32px 36px; text-align:center; max-width:420px; width:100%;
    box-shadow:0 30px 60px -30px rgba(0,0,0,.5); transform:scale(.8); opacity:0; max-height:92vh; overflow:auto}
  .overlay.show .modal{animation:modalPop .6s cubic-bezier(.2,1.3,.35,1) forwards}
  @keyframes modalPop{0%{transform:scale(.7) translateY(14px); opacity:0}60%{opacity:1}100%{transform:scale(1) translateY(0); opacity:1}}
  .modal h2{font-family:'Frank Ruhl Libre',serif; font-size:28px; font-weight:900; margin-bottom:6px}
  .modal p.msub{color:var(--ink-soft); margin-bottom:20px; font-size:14.5px}
  .final{display:flex; gap:26px; justify-content:center; margin-bottom:18px}
  .final .n{font-family:'Frank Ruhl Libre',serif; font-size:32px; font-weight:900; color:var(--accent); animation:countPulse .5s ease .25s both}
  .final .l{font-size:12px; color:var(--ink-soft); letter-spacing:1px}
  @keyframes countPulse{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .record{display:none; margin:-2px 0 16px; font-family:'Frank Ruhl Libre',serif; font-weight:900; color:var(--accent); font-size:19px; animation:countPulse .5s ease .3s both}
  .record.show{display:block}
  .results{display:flex; flex-direction:column; gap:7px; margin:6px 0 20px}
  .rrow{display:flex; align-items:center; gap:10px; padding:9px 13px; border-radius:12px; background:rgba(0,0,0,.03); border:1.5px solid transparent}
  .rrow.win{border-color:var(--accent); background:rgba(125,44,181,.07)}
  .rrow .dot{width:15px; height:15px; border-radius:50%; flex:0 0 auto}
  .rrow .rn{font-weight:500; font-size:15px}
  .rrow .rs{margin-inline-start:auto; font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:20px}
  .rrow .crown{color:#C58A2E; font-size:14px}

  .mode-row{display:flex; gap:10px; margin-bottom:16px}
  .mode-btn{flex:1; padding:13px; border-radius:12px; border:1.5px solid var(--line); background:var(--panel-2); cursor:pointer; font-family:'Heebo'; font-size:15px; color:var(--ink); transition:.15s}
  .mode-btn.active{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 13%, #fff); color:var(--accent)}
  .count-row{display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:12px; font-size:15px; color:var(--ink)}
  .count-row button{width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); font-size:22px; line-height:1; cursor:pointer; color:var(--ink)}
  #pCount{font-family:'Frank Ruhl Libre',serif; font-size:24px; font-weight:700; min-width:26px; text-align:center}
  .setup-hint{font-size:12px; color:var(--ink-soft); margin-bottom:10px}
  .names{display:flex; flex-direction:column; gap:8px; margin-bottom:18px}
  .nrow{display:flex; align-items:center; gap:9px}
  .nrow .dot{width:16px; height:16px; border-radius:50%; flex:0 0 auto}
  .nrow input{flex:1; min-width:0; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:'Heebo'; font-size:14px; text-align:start; color:var(--ink); background:var(--panel-2)}
  .nrow select{flex:0 0 auto; padding:10px 8px; border:1.5px solid var(--line); border-radius:10px; font-family:'Heebo'; font-size:13px; color:var(--ink); background:var(--panel-2)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>סט</h1><span class="sub">מצאו שלישיות · כל תכונה זהה או שונה לגמרי</span></div>
    <div class="stats">
      <div class="stat" id="statSets"><div class="label">סטים</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">בחפיסה</div><div class="value" id="deck">69</div></div>
      <div class="stat timer"><div class="label">זמן</div><div class="value" id="clock">0:00</div></div>
      <div class="stat best" id="statBest"><div class="label">שיא</div><div class="value" id="best">—</div></div>
      <div class="stat"><div class="label">רמזים</div><div class="value" id="hints">0</div></div>
    </div>
  </header>

  <div class="palette-wrap" id="paletteWrap">
    <button class="pal-toggle" id="palToggle" aria-expanded="false">
      <span class="dots" id="curDots"></span><span class="pal-name">פלטת צבעים</span><span class="chev">▾</span>
    </button>
    <div class="pal-menu" id="palMenu"></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="btn ghost" id="noset">אין סט</button>
    <button class="btn ghost" id="hint">רמז</button>
    <button class="btn ghost" id="pause">השהה</button>
    <button class="btn ghost" id="reset">משחק חדש</button>
  </div>
  <div class="hint-label" id="hintLabel">כפתור הרמז שומש 0 פעמים</div>
</div>

<canvas id="confetti"></canvas>
<div id="pauseScreen"><button class="btn primary" id="resumeBtn">המשך משחק</button></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="mTitle">סיימתם!</h2>
    <p class="msub" id="mSub">אין עוד סטים בחפיסה</p>
    <div id="mBody"></div>
    <div class="record" id="mRecord">שיא חדש!</div>
    <div style="display:flex; gap:10px">
      <button class="btn primary" id="mAgain" style="flex:1">משחק חדש</button>
      <button class="btn ghost" id="mClose" style="flex:1">סיום</button>
    </div>
  </div>
</div>

<div class="overlay" id="setup">
  <div class="modal">
    <h2>משחק סט</h2>
    <p class="msub">בחרו מצב משחק</p>
    <div class="mode-row">
      <button class="mode-btn active" data-mode="single">שחקן יחיד</button>
      <button class="mode-btn" data-mode="multi">כמה שחקנים</button>
    </div>
    <div id="multiOpts" style="display:none">
      <div class="count-row"><button id="pMinus">−</button><span id="pCount">2</span><button id="pPlus">+</button><span>שחקנים</span></div>
      <div class="setup-hint">שם ומיקום התחלתי של הבאזר (דאבל־קליק על באזר במשחק מאפשר לגרור אותו)</div>
      <div class="names" id="nameInputs"></div>
    </div>
    <button class="btn start" id="startBtn" style="width:100%">התחל משחק</button>
    <button class="btn ghost" id="cancelSetup" style="width:100%; margin-top:8px; display:none">ביטול — חזרה למשחק</button>
  </div>
</div>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}

const PALETTES = [
  { name:'קלאסי',   colors:['#E12D22','#7D2CB5','#1E9E48'], page:'#F6F2EB', ink:'#3B3733', inkSoft:'#8A837C', line:'#E9E2D6', accent:'#7D2CB5' },
  { name:'דובדבן',  colors:['#C81E1E','#0E5D54','#7BDBC9'], page:'#EAF5F1', ink:'#2E514C', inkSoft:'#75928C', line:'#D6EAE3', accent:'#C81E1E' },
  { name:'שקיעה',  colors:['#E84B8A','#F2C230','#EE7B30'], page:'#FBEFE6', ink:'#5A4038', inkSoft:'#9A8177', line:'#F3DFD0', accent:'#EE7B30' },
  { name:'פרפר',    colors:['#2F8378','#8E9082','#C9A21F'], page:'#F2F0E4', ink:'#54524A', inkSoft:'#8B877B', line:'#E7E2D2', accent:'#B79A3C' },
  { name:'מדבר',    colors:['#6E9040','#AC5F8E','#C96A34'], page:'#F1ECE3', ink:'#564C42', inkSoft:'#8C8075', line:'#E7DDD0', accent:'#C96A34' },
];
let paletteIndex = 0;
const PLAYER_COLORS = ['#E23B2E','#2E86C1','#27AE60','#8E44AD','#E67E22','#16A085'];
const POS_ORDER = ['bottom','top','left','right','bl','br'];
const POS_NAME = { bottom:'למטה', top:'למעלה', left:'שמאל', right:'ימין', bl:'למטה-שמאל', br:'למטה-ימין' };
const POS_ROT  = { top:180, left:90, right:-90 };
const SQUIGGLE = "M 90.9,0.0 L 87.1,0.8 L 83.6,2.6 L 80.2,4.6 L 76.8,6.4 L 73.2,8.1 L 69.5,9.3 L 65.7,10.0 L 61.8,10.2 L 57.9,9.8 L 54.1,8.9 L 50.4,7.5 L 46.8,6.2 L 43.0,5.0 L 39.3,4.0 L 35.4,3.3 L 31.5,3.1 L 27.6,3.1 L 23.7,3.6 L 19.9,4.5 L 16.3,5.9 L 12.8,7.7 L 9.7,10.0 L 7.0,12.9 L 4.8,16.1 L 2.9,19.5 L 1.5,23.2 L 0.6,27.0 L 0.1,30.8 L 0.0,34.7 L 0.2,38.7 L 1.0,42.5 L 2.7,46.0 L 5.4,48.8 L 9.1,50.0 L 12.9,49.2 L 16.4,47.4 L 19.8,45.4 L 23.2,43.6 L 26.8,41.9 L 30.5,40.7 L 34.3,40.0 L 38.2,39.8 L 42.1,40.2 L 45.9,41.1 L 49.6,42.5 L 53.2,43.8 L 57.0,45.0 L 60.7,46.0 L 64.6,46.7 L 68.5,46.9 L 72.4,46.9 L 76.3,46.4 L 80.1,45.5 L 83.7,44.1 L 87.2,42.3 L 90.3,40.0 L 93.0,37.1 L 95.2,33.9 L 97.1,30.5 L 98.5,26.8 L 99.4,23.0 L 99.9,19.2 L 100.0,15.3 L 99.8,11.3 L 99.0,7.5 L 97.3,4.0 L 94.6,1.2 Z";

function shapeEl(shape, style){
  if(shape===0) return `<polygon points="50,0.6 99.4,25 50,49.4 0.6,25" ${style} stroke-linejoin="round"/>`;
  if(shape===1) return `<rect x="0.6" y="0.6" width="98.8" height="48.8" rx="24.4" ry="24.4" ${style}/>`;
  return `<path d="${SQUIGGLE}" ${style} stroke-linejoin="round"/>`;
}
let uid=0;
function cardSVG(card){
  const color=PALETTES[paletteIndex].colors[card.color];
  const n=card.count+1, symW=100, symH=50, gap=16, vbW=112, vbH=196, x=(vbW-symW)/2, totalH=n*symH+(n-1)*gap, startY=(vbH-totalH)/2;
  const pid='sp'+(uid++); let defs='', style;
  if(card.fill===0) style=`fill="${color}" stroke="${color}" stroke-width="1"`;
  else if(card.fill===1) style=`fill="none" stroke="${color}" stroke-width="1.3"`;
  else{ style=`fill="url(#${pid})" stroke="${color}" stroke-width="1.1"`;
    defs=`<defs><pattern id="${pid}" width="4.4" height="4" patternUnits="userSpaceOnUse"><line x1="1" y1="0" x2="1" y2="4" stroke="${color}" stroke-width="0.8"/></pattern></defs>`; }
  let body=''; for(let i=0;i<n;i++) body+=`<g transform="translate(${x},${startY+i*(symH+gap)})">${shapeEl(card.shape,style)}</g>`;
  return `<svg viewBox="0 0 ${vbW} ${vbH}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${defs}${body}</svg>`;
}

let deck=[], board=[], selected=[], score=0, started=false, seconds=0, timer=null, locked=false;
let mode='single', players=[], activePlayer=null, buzzTO=null, hintUses=0, best=null;
let moveMode=null; const lastDown={}, buzzT={}; let paused=false, paletteHold=false, hintCards=null, hintPick=null;
const CARD_AR=112/196, BUZZ_MS=5000;

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function buildDeck(){ const d=[]; for(let c=0;c<3;c++)for(let s=0;s<3;s++)for(let f=0;f<3;f++)for(let n=0;n<3;n++) d.push({color:c,shape:s,fill:f,count:n}); return shuffle(d); }
function isSet(a,b,c){ return ['color','shape','fill','count'].every(k=>((a[k]+b[k]+c[k])%3)===0); }
function findSet(cards){ for(let i=0;i<cards.length-2;i++)for(let j=i+1;j<cards.length-1;j++)for(let k=j+1;k<cards.length;k++) if(isSet(cards[i],cards[j],cards[k])) return [i,j,k]; return null; }
function findAllSets(cards){ const r=[]; for(let i=0;i<cards.length-2;i++)for(let j=i+1;j<cards.length-1;j++)for(let k=j+1;k<cards.length;k++) if(isSet(cards[i],cards[j],cards[k])) r.push([i,j,k]); return r; }

function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function tick(){ if(timer)return; timer=setInterval(()=>{seconds++; document.getElementById('clock').textContent=fmt(seconds);},1000); }
function startClock(){ started=true; if(!paused) tick(); }
function stopClock(){ clearInterval(timer); timer=null; }
function pauseGame(){ if(!started||paused) return; paused=true; stopClock(); document.getElementById('board').classList.add('blurred'); document.getElementById('pauseScreen').classList.add('show'); const pb=document.getElementById('pause'); if(pb) pb.textContent='המשך'; }
function resumeGame(){ if(!paused) return; paused=false; document.getElementById('board').classList.remove('blurred'); document.getElementById('pauseScreen').classList.remove('show'); const pb=document.getElementById('pause'); if(pb) pb.textContent='השהה'; tick(); }
function togglePause(){ if(!started) return; paused?resumeGame():pauseGame(); }

function layoutBoard(){
  const b=document.getElementById('board');
  const cols=Math.max(4, Math.ceil(board.length/3)), rows=Math.max(1, Math.ceil(board.length/cols));
  const g=parseFloat(getComputedStyle(b).gap)||10, bw=b.clientWidth, bh=b.clientHeight;
  if(bw<=0||bh<=0) return;
  const cellW=(bw-(cols-1)*g)/cols, cellH=(bh-(rows-1)*g)/rows;
  let cardH=Math.min(cellH, cellW/CARD_AR), cardW=cardH*CARD_AR;
  b.style.gridTemplateColumns=`repeat(${cols}, ${cardW}px)`; b.style.gridAutoRows=`${cardH}px`;
}
function render(enterIdx){
  const b=document.getElementById('board'); b.innerHTML='';
  board.forEach((card,i)=>{
    const el=document.createElement('div');
    el.className='card'+(selected.includes(i)?' sel':'')+((enterIdx&&enterIdx.has(i))?' enter':'');
    el.innerHTML=cardSVG(card); el.onclick=()=>pick(i); b.appendChild(el);
  });
  layoutBoard();
  document.getElementById('score').textContent=score;
  document.getElementById('deck').textContent=deck.length;
}

/* באזרים צפים + גרירה */
function defaultPos(pos){
  const W=innerWidth,H=innerHeight,M=52;
  switch(pos){
    case 'top': return [W/2, M];
    case 'bottom': return [W/2, H-M];
    case 'left': return [M+30, H/2];
    case 'right': return [W-M-30, H/2];
    case 'bl': return [W*0.17, H-M];
    case 'br': return [W*0.83, H-M];
    default: return [W/2, H-M];
  }
}
function orientFor(x,y){
  const W=innerWidth,H=innerHeight, dl=x, dr=W-x, dt=y, db=H-y, m=Math.min(dl,dr,dt,db);
  if(m===dt) return 180; if(m===db) return 0; if(m===dl) return 90; return -90;
}
function renderBuzzers(){
  document.querySelectorAll('.pbtn').forEach(e=>e.remove());
  if(mode!=='multi') return;
  players.forEach((p,i)=>{
    if(p.x==null){ const d=defaultPos(p.pos); p.x=d[0]; p.y=d[1]; }
    const lk = p.lockUntil && performance.now()<p.lockUntil;
    const el=document.createElement('button');
    el.className='pbtn'+(activePlayer===i?' active':'')+(lk?' locked':'')+(moveMode===i?' movable':'');
    el.style.color=p.color; el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.setProperty('--rot',(p.rot!=null?p.rot:(POS_ROT[p.pos]||0))+'deg');
    el.innerHTML=`<span class="pinner"><span class="pdot" style="background:${p.color}"></span>
      <span class="pname">${esc(p.name)}</span><span class="pscore" style="color:${p.color}">${p.score}</span></span><span class="tbar"></span>`;
    attachBuzzer(el,i);
    document.body.appendChild(el);
  });
}
function attachBuzzer(el,i){
  el.addEventListener('pointerdown',(ev)=>{
    if(moveMode===i){ startDrag(i,el,ev,false); return; }
    const now=performance.now(); const dbl=(now-(lastDown[i]||0))<300; lastDown[i]=now;
    if(dbl){ ev.preventDefault(); clearTimeout(buzzT[i]); moveMode=i; el.classList.add('movable'); startDrag(i,el,ev,true); return; }
    clearTimeout(buzzT[i]);
    buzzT[i]=setTimeout(()=>{ if(moveMode!==i) buzz(i); }, 280);
  });
}
function startDrag(i,el,ev,keepIfNoMove){
  ev.preventDefault();
  const sx=ev.clientX, sy=ev.clientY, ox=players[i].x, oy=players[i].y; let moved=false;
  const mv=(e)=>{ moved=true; players[i].moved=true;
    players[i].x=Math.max(24,Math.min(innerWidth-24, ox+e.clientX-sx));
    players[i].y=Math.max(24,Math.min(innerHeight-24, oy+e.clientY-sy));
    players[i].rot=orientFor(players[i].x,players[i].y);
    el.style.left=players[i].x+'px'; el.style.top=players[i].y+'px'; el.style.setProperty('--rot',players[i].rot+'deg'); };
  const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    if(moved || !keepIfNoMove){ moveMode=null; el.classList.remove('movable'); } };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}

function pick(i){
  if(locked||paused) return;
  if(mode==='multi' && activePlayer===null){ toast('לחצו על הבאזר שלכם כדי לבחור','warn'); return; }
  if(!started) startClock();
  const at=selected.indexOf(i);
  if(at>=0){ selected.splice(at,1); render(); return; }
  if(selected.length===3) return;
  selected.push(i); render();
  if(selected.length===3) evaluate();
}
function evaluate(){
  const [i,j,k]=selected, cards=[board[i],board[j],board[k]];
  if(isSet(...cards)){
    locked=true; clearBuzz();
    if(mode==='multi' && activePlayer!==null){ players[activePlayer].score++; } else { score++; document.getElementById('score').textContent=score; }
    const slots=[...selected].sort((a,b)=>a-b);
    document.querySelectorAll('.card').forEach((el,idx)=>{ if(slots.includes(idx)){ el.style.animationDelay=(slots.indexOf(idx)*0.08)+'s'; el.classList.add('matched'); }});
    const wasReplace = board.length<=12;
    setTimeout(()=>{
      let enter=null;
      if(!wasReplace){ [...slots].sort((a,b)=>b-a).forEach(idx=>board.splice(idx,1)); }
      else{ slots.forEach(idx=>{ board[idx]= deck.length? deck.pop() : null; }); const hadNull=board.includes(null); board=board.filter(Boolean); enter=hadNull?null:new Set(slots); }
      selected=[]; locked=false; activePlayer=null;
      render(enter); renderBuzzers();
      if(enter){ const cs=document.querySelectorAll('.card'); [...enter].sort((a,b)=>a-b).forEach((idx,n)=>{ const el=cs[idx]; if(el) el.style.animationDelay=(n*0.08)+'s'; }); }
      toast('סט! נמצא','ok'); checkGameOver();
    },560);
  }else{
    locked=true;
    document.querySelectorAll('.card').forEach((el,idx)=>{ if(selected.includes(idx)) el.classList.add('bad'); });
    const who=activePlayer;
    setTimeout(()=>{
      selected=[]; locked=false;
      if(mode==='multi'){ activePlayer=null; clearBuzz();
        if(who!=null){ players[who].lockUntil=performance.now()+2500; setTimeout(renderBuzzers,2600); }
        renderBuzzers(); toast('לא סט — נסו שוב','warn');
      }
      render();
    },440);
  }
}

function buzz(p){
  if(mode!=='multi'||locked||paused||activePlayer!==null) return;
  if(players[p].lockUntil && performance.now()<players[p].lockUntil) return;
  if(!started) startClock();
  activePlayer=p; selected=[]; renderBuzzers();
  clearBuzz(); buzzTO=setTimeout(()=>failBuzz('נגמר הזמן'), BUZZ_MS);
}
function clearBuzz(){ clearTimeout(buzzTO); buzzTO=null; }
function failBuzz(msg){
  if(activePlayer===null) return;
  const who=activePlayer; players[who].lockUntil=performance.now()+2000; setTimeout(renderBuzzers,2100);
  activePlayer=null; selected=[]; clearBuzz(); renderBuzzers(); render(); toast(msg,'warn');
}

function onNoSet(){
  if(locked) return;
  if(findSet(board)){ toast('קיים סט — המשיכו לחפש','warn'); return; }
  if(deck.length===0){ checkGameOver(); return; }
  if(!started) startClock();
  const add=Math.min(3,deck.length); for(let n=0;n<add;n++) board.push(deck.pop());
  selected=[]; render(); toast('לא נמצא סט — נוספו 3 קלפים');
}
/* רמז: מדגיש קלף אקראי מתוך סט אקראי (לא תמיד הראשון מימין) */
function hint(){
  if(locked||paused) return;
  const sets=findAllSets(board);
  if(!sets.length){ toast('אין סט על הלוח — לחצו "אין סט"','warn'); return; }
  hintUses++; updateHints();
  let idx;
  if(hintCards && hintPick && hintCards.every(c=>board.includes(c)) && board.includes(hintPick)){
    idx=board.indexOf(hintPick);                 // אותו קלף כל עוד הסט קיים
  } else {
    const set=sets[Math.random()*sets.length|0];
    hintCards=set.map(i=>board[i]);
    hintPick=hintCards[Math.random()*hintCards.length|0];
    idx=board.indexOf(hintPick);
  }
  const el=document.querySelectorAll('.card')[idx];
  if(el){ el.classList.add('hint'); setTimeout(()=>el.classList.remove('hint'),1200); }
}
function updateHints(){
  document.getElementById('hints').textContent=hintUses;
  document.getElementById('hintLabel').textContent='כפתור הרמז שומש '+hintUses+' פעמים';
}

function checkGameOver(){
  if(deck.length===0 && !findSet(board)){
    stopClock(); clearBuzz();
    const body=document.getElementById('mBody'), rec=document.getElementById('mRecord'); rec.className='record';
    if(mode==='single'){
      let newRecord=false;
      if(score>0 && (best==null || seconds<best)){ best=seconds; newRecord=true; saveBest(); updateBest(); }
      document.getElementById('mTitle').textContent = score>0 ? 'סיימתם!' : 'נגמר';
      document.getElementById('mSub').textContent = 'אין עוד סטים בחפיסה';
      body.innerHTML=`<div class="final"><div><div class="n">${score}</div><div class="l">סטים</div></div><div><div class="n">${fmt(seconds)}</div><div class="l">זמן</div></div><div><div class="n">${hintUses}</div><div class="l">רמזים</div></div></div>`;
      if(newRecord) rec.className='record show';
      if(score>0) confettiBurst();
    }else{
      const sorted=[...players].sort((a,b)=>b.score-a.score);
      const top=sorted[0].score, winners=sorted.filter(p=>p.score===top);
      document.getElementById('mTitle').textContent = top===0 ? 'נגמר' : (winners.length>1 ? 'תיקו!' : 'המנצח/ת: '+winners[0].name);
      document.getElementById('mSub').textContent = 'זמן משחק '+fmt(seconds)+' · '+hintUses+' רמזים';
      let html='<div class="results">';
      sorted.forEach(p=>{ const w=(p.score===top&&top>0); html+=`<div class="rrow ${w?'win':''}"><span class="dot" style="background:${p.color}"></span><span class="rn">${esc(p.name)}</span>${w?'<span class="crown">★</span>':''}<span class="rs">${p.score}</span></div>`; });
      html+='</div>'; body.innerHTML=html;
      if(top>0) confettiBurst();
    }
    document.getElementById('overlay').classList.add('show');
  }
}
function confettiBurst(){
  const c=document.getElementById('confetti'); if(!c) return;
  const ctx=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight; c.classList.add('on');
  const cols=['#E12D22','#7D2CB5','#1E9E48','#F2C230','#EE7B30','#E84B8A','#2F8378','#7BDBC9']; let parts=[];
  const launch=(cx,cy,ang)=>{ for(let i=0;i<70;i++){ const a=ang+(Math.random()-.5)*0.9, sp=8+Math.random()*9;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.26+Math.random()*0.08,s:6+Math.random()*7,rot:Math.random()*6.28,vr:(Math.random()-.5)*0.5,col:cols[Math.random()*cols.length|0],life:0}); } };
  launch(innerWidth*0.5, innerHeight*0.62, -Math.PI/2); launch(innerWidth*0.12, innerHeight, -Math.PI/2.6); launch(innerWidth*0.88, innerHeight, -Math.PI/1.63);
  const t0=performance.now();
  (function frame(now){ ctx.clearRect(0,0,c.width,c.height); let alive=false;
    for(const p of parts){ p.vy+=p.g; p.vx*=0.995; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
      if(p.y<c.height+30) alive=true; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(0,1-(p.life-140)/70); ctx.fillStyle=p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); ctx.restore(); }
    if(now-t0<3600 && alive) requestAnimationFrame(frame); else{ ctx.clearRect(0,0,c.width,c.height); c.classList.remove('on'); }
  })(t0);
}

function loadBest(){ try{ const v=localStorage.getItem('set_best_time'); best=v!=null?parseInt(v,10):null; }catch(e){ best=null; } updateBest(); }
function saveBest(){ try{ localStorage.setItem('set_best_time', String(best)); }catch(e){} }
function updateBest(){ const el=document.getElementById('best'); if(el) el.textContent = best!=null ? fmt(best) : '—'; }

function dotsHTML(p){ return p.colors.map(c=>`<i style="background:${c}"></i>`).join(''); }
function updateCurDots(){ const el=document.getElementById('curDots'); if(el) el.innerHTML=dotsHTML(PALETTES[paletteIndex]); }
function applyPalette(){ const p=PALETTES[paletteIndex], r=document.documentElement.style;
  r.setProperty('--page',p.page); r.setProperty('--ink',p.ink); r.setProperty('--ink-soft',p.inkSoft); r.setProperty('--line',p.line); r.setProperty('--accent',p.accent); }
function buildPaletteBar(){
  const menu=document.getElementById('palMenu');
  PALETTES.forEach((p,i)=>{
    const chip=document.createElement('button'); chip.className='pchip'+(i===paletteIndex?' active':'');
    chip.innerHTML=`<span class="dots">${dotsHTML(p)}</span>${p.name}`;
    chip.onclick=()=>{ paletteIndex=i; document.querySelectorAll('.pchip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); applyPalette(); render(); updateCurDots(); closePalette(); };
    menu.appendChild(chip);
  });
  updateCurDots();
  const wrap=document.getElementById('paletteWrap'), toggle=document.getElementById('palToggle');
  toggle.onclick=(e)=>{ e.stopPropagation(); if(wrap.classList.contains('open')) closePalette(); else openPalette(); };
  document.addEventListener('click',(e)=>{ if(!wrap.contains(e.target)) closePalette(); });
}
function openPalette(){
  document.getElementById('paletteWrap').classList.add('open');
  if(started && !paused){ document.getElementById('board').classList.add('blurred'); stopClock(); paletteHold=true; }
}
function closePalette(){
  document.getElementById('paletteWrap').classList.remove('open');
  if(paletteHold){ paletteHold=false; if(!paused){ document.getElementById('board').classList.remove('blurred'); tick(); } }
}

let setupMode='single', setupCount=2, setupNames=[], setupPositions=[], setupColors=[];
function ensureSetupArrays(){
  for(let i=0;i<setupCount;i++){ if(!setupNames[i]) setupNames[i]='שחקן '+(i+1); if(!setupColors[i]) setupColors[i]=PLAYER_COLORS[i]; }
  setupNames.length=setupCount; setupColors.length=setupCount; setupPositions=POS_ORDER.slice(0,setupCount);
}
function buildNameInputs(){
  ensureSetupArrays();
  const box=document.getElementById('nameInputs'); box.innerHTML='';
  for(let i=0;i<setupCount;i++){
    const row=document.createElement('div'); row.className='nrow';
    const opts=POS_ORDER.slice(0,setupCount).map(id=>`<option value="${id}" ${setupPositions[i]===id?'selected':''}>${POS_NAME[id]}</option>`).join('');
    row.innerHTML=`<input type="color" class="cpick" dir="ltr" value="${setupColors[i]}" data-i="${i}">
      <input type="text" maxlength="14" value="${esc(setupNames[i])}" data-i="${i}"><select data-i="${i}">${opts}</select>`;
    box.appendChild(row);
  }
  box.querySelectorAll('input[type=text]').forEach(inp=>{ inp.oninput=()=>{ setupNames[+inp.dataset.i]=inp.value; }; });
  box.querySelectorAll('.cpick').forEach(c=>{ c.oninput=()=>{ setupColors[+c.dataset.i]=c.value; }; });
  box.querySelectorAll('select').forEach(sel=>{ sel.onchange=()=>changePos(+sel.dataset.i, sel.value); });
}
function changePos(i,val){ const j=setupPositions.indexOf(val); if(j!==-1 && j!==i){ setupPositions[j]=setupPositions[i]; } setupPositions[i]=val; buildNameInputs(); }
function showSetup(allowCancel){
  document.getElementById('cancelSetup').style.display = allowCancel ? 'block' : 'none';
  document.getElementById('setup').classList.add('show');
}
function cancelSetup(){ document.getElementById('setup').classList.remove('show'); }
function closeApp(){
  try{ window.close(); }catch(e){}
  setTimeout(()=>{ document.body.innerHTML='<div style="height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;background:'+PALETTES[paletteIndex].page+';color:#5A4B41;font-family:Heebo,system-ui,sans-serif"><div style="font-family:\'Frank Ruhl Libre\',serif;font-size:34px;font-weight:900">תודה ששיחקתם!</div><div style="opacity:.7">אפשר לסגור את החלון.</div></div>'; }, 250);
}
function startFromSetup(){
  mode=setupMode;
  if(mode==='multi'){ ensureSetupArrays(); players=[]; for(let i=0;i<setupCount;i++) players.push({ name:(setupNames[i].trim()||('שחקן '+(i+1))), color:setupColors[i], pos:setupPositions[i], rot:(POS_ROT[setupPositions[i]]||0), score:0, lockUntil:0, x:null, y:null, moved:false }); }
  else players=[];
  document.getElementById('statSets').classList.toggle('hide', mode==='multi');
  document.getElementById('statBest').classList.toggle('hide', mode==='multi');
  document.getElementById('setup').classList.remove('show');
  newGame();
}
function newGame(){
  stopClock(); clearBuzz(); moveMode=null; paused=false; paletteHold=false; hintCards=null; hintPick=null;
  document.getElementById('board').classList.remove('blurred');
  document.getElementById('pauseScreen').classList.remove('show');
  const pb=document.getElementById('pause'); if(pb) pb.textContent='השהה';
  deck=buildDeck(); board=[]; selected=[]; score=0; seconds=0; started=false; locked=false; activePlayer=null; hintUses=0;
  if(mode==='multi') players.forEach(p=>{ p.score=0; p.lockUntil=0; });
  for(let n=0;n<12;n++) board.push(deck.pop());
  document.getElementById('clock').textContent='0:00';
  document.getElementById('overlay').classList.remove('show');
  updateHints(); applyPalette(); render(); renderBuzzers();
}

let toastT=null;
function toast(msg,type=''){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',1900); }

document.getElementById('noset').onclick=onNoSet;
document.getElementById('hint').onclick=hint;
document.getElementById('pause').onclick=togglePause;
document.getElementById('resumeBtn').onclick=resumeGame;
document.getElementById('reset').onclick=()=>showSetup(true);
document.getElementById('mAgain').onclick=()=>showSetup(false);
document.getElementById('cancelSetup').onclick=cancelSetup;
document.getElementById('mClose').onclick=closeApp;
document.querySelectorAll('.mode-btn').forEach(b=>{ b.onclick=()=>{
  document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  setupMode=b.dataset.mode; document.getElementById('multiOpts').style.display = setupMode==='multi'?'block':'none';
}; });
document.getElementById('pMinus').onclick=()=>{ if(setupCount>2){ setupCount--; document.getElementById('pCount').textContent=setupCount; buildNameInputs(); } };
document.getElementById('pPlus').onclick=()=>{ if(setupCount<6){ setupCount++; document.getElementById('pCount').textContent=setupCount; buildNameInputs(); } };
document.getElementById('startBtn').onclick=startFromSetup;
window.addEventListener('resize', ()=>{ layoutBoard(); if(mode==='multi'){ players.forEach(p=>{ if(!p.moved){ const d=defaultPos(p.pos); p.x=d[0]; p.y=d[1]; } }); renderBuzzers(); } });

buildPaletteBar(); loadBest(); buildNameInputs(); applyPalette(); showSetup();
</script>
</body>
