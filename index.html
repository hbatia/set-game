<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>סט · משחק</title>
<meta name="theme-color" content="#F6F2EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="סט">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#F6F2EB; --panel:#FFFFFF; --panel-2:#FFFFFF;
    --ink:#3B3733; --ink-soft:#8A837C; --line:#E9E2D6;
    --accent:#6E4A9E; --accent-ink:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Heebo',system-ui,sans-serif;
    background:radial-gradient(1100px 640px at 92% -12%, rgba(255,255,255,.55), transparent 60%), var(--page);
    color:var(--ink);
    height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
    padding:clamp(10px,2vw,24px);
    transition:background .6s ease,color .4s ease;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{flex:1; display:flex; flex-direction:column; min-height:0; width:100%; max-width:1120px; margin:0 auto}

  header.top{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:12px; flex:0 0 auto}
  .brand{display:flex; align-items:baseline; gap:12px}
  .brand h1{font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:clamp(30px,5vw,50px); line-height:.9; letter-spacing:.5px}
  .brand .sub{color:var(--ink-soft); font-size:13.5px; font-weight:400}
  @media(max-width:560px){ .brand .sub{display:none} }
  .stats{display:flex; gap:8px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:7px 14px; min-width:78px; text-align:center}
  .stat .label{font-size:10.5px; color:var(--ink-soft); letter-spacing:1.4px; text-transform:uppercase; margin-bottom:1px}
  .stat .value{font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:21px; font-variant-numeric:tabular-nums}
  .stat.timer .value{color:var(--accent)}
  .stat.best .value{color:#C58A2E}
  .record{display:none; margin:-4px 0 16px; font-family:'Frank Ruhl Libre',serif; font-weight:900; color:var(--accent); font-size:19px; letter-spacing:.5px; animation:countPulse .5s ease .3s both}

  .palette-wrap{position:relative; align-self:flex-start; margin-bottom:12px; flex:0 0 auto; z-index:35}
  .pal-toggle{display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-family:'Heebo';
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:9px 15px; font-size:14px; color:var(--ink);
    transition:transform .12s,box-shadow .2s}
  .pal-toggle:hover{transform:translateY(-1px); box-shadow:0 6px 14px -10px rgba(0,0,0,.35)}
  .pal-toggle .pal-name{font-weight:500}
  .pal-toggle .chev{color:var(--ink-soft); font-size:11px; transition:transform .22s}
  .palette-wrap.open .pal-toggle .chev{transform:rotate(180deg)}
  .pal-menu{position:absolute; top:calc(100% + 6px); inset-inline-start:0; min-width:205px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:7px;
    display:flex; flex-direction:column; gap:4px; box-shadow:0 22px 46px -20px rgba(0,0,0,.4);
    opacity:0; transform:translateY(-6px) scale(.98); transform-origin:top; pointer-events:none; transition:.18s ease}
  .palette-wrap.open .pal-menu{opacity:1; transform:none; pointer-events:auto}
  .dots{display:flex; flex:0 0 auto}
  .dots i{width:14px; height:14px; border-radius:50%; display:block; margin-inline-start:-5px; border:1.5px solid rgba(255,255,255,.8)}
  .dots i:first-child{margin-inline-start:0}
  .pchip{display:flex; align-items:center; gap:10px; cursor:pointer; width:100%;
    border:1.5px solid transparent; background:transparent; border-radius:11px;
    padding:8px 11px; font-size:14px; color:var(--ink); font-family:'Heebo'; text-align:start;
    transition:background .15s,border-color .15s}
  .pchip:hover{background:rgba(0,0,0,.04)}
  .pchip.active{border-color:var(--ink)}

  .board{flex:1 1 auto; min-height:0; display:grid; gap:clamp(7px,1.2vw,14px);
    justify-content:center; align-content:center; margin-bottom:12px; perspective:1100px}
  .card{position:relative; border-radius:14px; background:#fff;
    border:1.5px solid rgba(60,48,40,.12);
    box-shadow:0 7px 16px -13px rgba(60,45,35,.6);
    cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:5%;
    transition:transform .14s ease, box-shadow .2s ease}
  .card:hover{transform:translateY(-2px)}
  .card svg{width:100%; height:100%; display:block}
  .card.sel{box-shadow:inset 0 0 0 3px var(--ink), 0 12px 20px -14px rgba(60,45,35,.6); transform:translateY(-3px)}
  .card.matched{animation:matchOut .5s cubic-bezier(.45,0,.55,1) forwards; z-index:5; transform-style:preserve-3d; backface-visibility:hidden}
  .card.enter{animation:cardIn .55s cubic-bezier(.35,0,.3,1) both; transform-style:preserve-3d; backface-visibility:hidden}
  .card.bad{animation:shake .4s ease}
  .card.hint{box-shadow:inset 0 0 0 3px var(--accent); animation:glow 1.1s ease}
  @keyframes matchOut{
    0%{transform:rotateY(0deg) scale(1)}
    22%{transform:rotateY(0deg) scale(1.06); box-shadow:inset 0 0 0 3px var(--accent), 0 18px 30px -14px rgba(0,0,0,.5)}
    100%{transform:rotateY(-90deg) scale(1); opacity:0}
  }
  @keyframes cardIn{
    0%{transform:rotateY(90deg) scale(1); opacity:0}
    55%{opacity:1}
    100%{transform:rotateY(0deg) scale(1); opacity:1}
  }
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  @keyframes glow{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 3px var(--accent)}}

  .controls{display:flex; gap:10px; align-items:center; justify-content:center; flex:0 0 auto; flex-wrap:wrap}
  .btn{font-family:'Heebo'; font-size:14.5px; font-weight:500; cursor:pointer; border-radius:13px;
    padding:11px 20px; border:1.5px solid var(--line); background:var(--panel-2); color:var(--ink);
    transition:transform .12s,box-shadow .2s,background .2s}
  .btn:hover{transform:translateY(-2px); box-shadow:0 8px 16px -12px rgba(0,0,0,.4)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .btn.ghost{background:transparent}

  .toast{position:fixed; inset-inline:0; bottom:20px; margin-inline:auto; width:max-content; max-width:88vw;
    background:var(--ink); color:#fff; padding:12px 22px; border-radius:40px; font-size:14.5px;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.5); opacity:0; transform:translateY(14px);
    pointer-events:none; transition:.3s ease; z-index:40}
  .toast.show{opacity:1; transform:translateY(0)}
  .toast.ok{background:#4E7A54}
  .toast.warn{background:var(--accent)}

  #confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:70; opacity:0; transition:opacity .2s}
  #confetti.on{opacity:1}
  .overlay{position:fixed; inset:0; background:rgba(50,40,34,.42); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; opacity:0; pointer-events:none; transition:.3s}
  .overlay.show{opacity:1; pointer-events:auto}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:34px 38px; text-align:center; max-width:360px; box-shadow:0 30px 60px -30px rgba(0,0,0,.5); transform:scale(.8); opacity:0}
  .overlay.show .modal{animation:modalPop .6s cubic-bezier(.2,1.3,.35,1) forwards}
  @keyframes modalPop{0%{transform:scale(.7) translateY(14px); opacity:0}60%{opacity:1}100%{transform:scale(1) translateY(0); opacity:1}}
  .modal h2{font-family:'Frank Ruhl Libre',serif; font-size:28px; font-weight:900; margin-bottom:5px}
  .modal .final .n{animation:countPulse .5s ease .25s both}
  @keyframes countPulse{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .modal p{color:var(--ink-soft); margin-bottom:20px; font-size:14.5px}
  .modal .final{display:flex; gap:26px; justify-content:center; margin-bottom:24px}
  .modal .final .n{font-family:'Frank Ruhl Libre',serif; font-size:32px; font-weight:900; color:var(--accent)}
  .modal .final .l{font-size:12px; color:var(--ink-soft); letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>סט</h1>
      <span class="sub">מצאו שלישיות · כל תכונה זהה או שונה לגמרי</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="label">סטים</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">בחפיסה</div><div class="value" id="deck">69</div></div>
      <div class="stat timer"><div class="label">זמן</div><div class="value" id="clock">0:00</div></div>
      <div class="stat best"><div class="label">שיא</div><div class="value" id="best">—</div></div>
    </div>
  </header>

  <div class="palette-wrap" id="paletteWrap">
    <button class="pal-toggle" id="palToggle" aria-expanded="false">
      <span class="dots" id="curDots"></span>
      <span class="pal-name">פלטת צבעים</span>
      <span class="chev">▾</span>
    </button>
    <div class="pal-menu" id="palMenu"></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="btn primary" id="noset">אין סט</button>
    <button class="btn ghost" id="hint">רמז</button>
    <button class="btn ghost" id="reset">משחק חדש</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<canvas id="confetti"></canvas>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="mTitle">סיימתם!</h2>
    <p id="mSub">אין עוד סטים בחפיסה</p>
    <div class="final">
      <div><div class="n" id="mScore">0</div><div class="l">סטים</div></div>
      <div><div class="n" id="mTime">0:00</div><div class="l">זמן</div></div>
    </div>
    <div class="record" id="mRecord">שיא חדש!</div>
    <button class="btn primary" id="mAgain">משחק חדש</button>
  </div>
</div>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }

/* ---------------- פלטות צבעים ---------------- */
const PALETTES = [
  { name:'קלאסי',   colors:['#E12D22','#7D2CB5','#1E9E48'],   /* אדום · סגול · ירוק — חיים יותר */
    page:'#F6F2EB', ink:'#3B3733', inkSoft:'#8A837C', line:'#E9E2D6', accent:'#7D2CB5' },
  { name:'דובדבן',  colors:['#C81E1E','#0E5D54','#7BDBC9'],   /* אדום · טורקיז כהה · מנטה בהירה */
    page:'#EAF5F1', ink:'#2E514C', inkSoft:'#75928C', line:'#D6EAE3', accent:'#C81E1E' },
  { name:'שקיעה',  colors:['#E84B8A','#F2C230','#EE7B30'],   /* ורוד · צהוב · כתום */
    page:'#FBEFE6', ink:'#5A4038', inkSoft:'#9A8177', line:'#F3DFD0', accent:'#EE7B30' },
  { name:'פרפר',    colors:['#2F8378','#8E9082','#C9A21F'],   /* טורקיז · אפור · חרדל */
    page:'#F2F0E4', ink:'#54524A', inkSoft:'#8B877B', line:'#E7E2D2', accent:'#B79A3C' },
  { name:'מדבר',    colors:['#6E9040','#AC5F8E','#C96A34'],   /* מרווה · מוב · טרקוטה */
    page:'#F1ECE3', ink:'#564C42', inkSoft:'#8C8075', line:'#E7DDD0', accent:'#C96A34' },
];
let paletteIndex = 0;

/* -------- צורות אופקיות בתיבה 100×50 (אותו אורך/רוחב מקסימלי) -------- */
const SQUIGGLE = "M 90.9,0.0 L 87.1,0.8 L 83.6,2.6 L 80.2,4.6 L 76.8,6.4 L 73.2,8.1 L 69.5,9.3 L 65.7,10.0 L 61.8,10.2 L 57.9,9.8 L 54.1,8.9 L 50.4,7.5 L 46.8,6.2 L 43.0,5.0 L 39.3,4.0 L 35.4,3.3 L 31.5,3.1 L 27.6,3.1 L 23.7,3.6 L 19.9,4.5 L 16.3,5.9 L 12.8,7.7 L 9.7,10.0 L 7.0,12.9 L 4.8,16.1 L 2.9,19.5 L 1.5,23.2 L 0.6,27.0 L 0.1,30.8 L 0.0,34.7 L 0.2,38.7 L 1.0,42.5 L 2.7,46.0 L 5.4,48.8 L 9.1,50.0 L 12.9,49.2 L 16.4,47.4 L 19.8,45.4 L 23.2,43.6 L 26.8,41.9 L 30.5,40.7 L 34.3,40.0 L 38.2,39.8 L 42.1,40.2 L 45.9,41.1 L 49.6,42.5 L 53.2,43.8 L 57.0,45.0 L 60.7,46.0 L 64.6,46.7 L 68.5,46.9 L 72.4,46.9 L 76.3,46.4 L 80.1,45.5 L 83.7,44.1 L 87.2,42.3 L 90.3,40.0 L 93.0,37.1 L 95.2,33.9 L 97.1,30.5 L 98.5,26.8 L 99.4,23.0 L 99.9,19.2 L 100.0,15.3 L 99.8,11.3 L 99.0,7.5 L 97.3,4.0 L 94.6,1.2 Z";

function shapeEl(shape, style){
  if(shape===0)  // מעוין אופקי
    return `<polygon points="50,0.6 99.4,25 50,49.4 0.6,25" ${style} stroke-linejoin="round"/>`;
  if(shape===1)  // גלולה אופקית
    return `<rect x="0.6" y="0.6" width="98.8" height="48.8" rx="24.4" ry="24.4" ${style}/>`;
  // גל — קו מתאר שחולץ מהתמונה
  return `<path d="${SQUIGGLE}" ${style} stroke-linejoin="round"/>`;
}

let uid=0;
function cardSVG(card){
  const color=PALETTES[paletteIndex].colors[card.color];
  const n=card.count+1, symW=100, symH=50, gap=16;
  const vbW=112, vbH=196, x=(vbW-symW)/2, totalH=n*symH+(n-1)*gap, startY=(vbH-totalH)/2;
  const pid='sp'+(uid++);
  let defs='', style;
  if(card.fill===0) style=`fill="${color}" stroke="${color}" stroke-width="1"`;                 // מלא
  else if(card.fill===1) style=`fill="none" stroke="${color}" stroke-width="1.3"`;               // ריק
  else{ style=`fill="url(#${pid})" stroke="${color}" stroke-width="1.1"`;                        // מקווקו (פסים אנכיים דקים)
    defs=`<defs><pattern id="${pid}" width="4.4" height="4" patternUnits="userSpaceOnUse"><line x1="1" y1="0" x2="1" y2="4" stroke="${color}" stroke-width="0.8"/></pattern></defs>`; }
  let body='';
  for(let i=0;i<n;i++) body+=`<g transform="translate(${x},${startY+i*(symH+gap)})">${shapeEl(card.shape,style)}</g>`;
  return `<svg viewBox="0 0 ${vbW} ${vbH}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${defs}${body}</svg>`;
}

/* -------- מצב המשחק -------- */
let deck=[], board=[], selected=[], score=0, started=false, seconds=0, timer=null, locked=false;
const CARD_AR = 112/196;  // רוחב/גובה של הכרטיס (פורטרט)

function buildDeck(){
  const d=[];
  for(let c=0;c<3;c++)for(let s=0;s<3;s++)for(let f=0;f<3;f++)for(let n=0;n<3;n++) d.push({color:c,shape:s,fill:f,count:n});
  return shuffle(d);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function isSet(a,b,c){ return ['color','shape','fill','count'].every(k=>((a[k]+b[k]+c[k])%3)===0); }
function findSet(cards){
  for(let i=0;i<cards.length-2;i++)for(let j=i+1;j<cards.length-1;j++)for(let k=j+1;k<cards.length;k++)
    if(isSet(cards[i],cards[j],cards[k])) return [i,j,k];
  return null;
}

/* -------- טיימר -------- */
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function startClock(){ if(timer)return; started=true; timer=setInterval(()=>{seconds++; document.getElementById('clock').textContent=fmt(seconds);},1000); }
function stopClock(){ clearInterval(timer); timer=null; }

/* -------- פריסת הלוח: כרטיסים פורטרט שנכנסים בלי גלילה -------- */
function layoutBoard(){
  const b=document.getElementById('board');
  const cols=Math.max(4, Math.ceil(board.length/3));
  const rows=Math.max(1, Math.ceil(board.length/cols));
  const g=parseFloat(getComputedStyle(b).gap)||10;
  const bw=b.clientWidth, bh=b.clientHeight;
  if(bw<=0||bh<=0) return;
  const cellW=(bw-(cols-1)*g)/cols, cellH=(bh-(rows-1)*g)/rows;
  let cardH=Math.min(cellH, cellW/CARD_AR);
  let cardW=cardH*CARD_AR;
  b.style.gridTemplateColumns=`repeat(${cols}, ${cardW}px)`;
  b.style.gridAutoRows=`${cardH}px`;
}

/* -------- ציור הלוח -------- */
function render(enterIdx){
  const b=document.getElementById('board');
  b.innerHTML='';
  board.forEach((card,i)=>{
    const el=document.createElement('div');
    el.className='card'+(selected.includes(i)?' sel':'')+((enterIdx&&enterIdx.has(i))?' enter':'');
    el.innerHTML=cardSVG(card);
    el.onclick=()=>pick(i);
    b.appendChild(el);
  });
  layoutBoard();
  document.getElementById('score').textContent=score;
  document.getElementById('deck').textContent=deck.length;
}

/* -------- אינטראקציות -------- */
function pick(i){
  if(locked) return;
  if(!started) startClock();
  const at=selected.indexOf(i);
  if(at>=0){ selected.splice(at,1); render(); return; }
  if(selected.length===3) return;
  selected.push(i); render();
  if(selected.length===3) evaluate();
}
function evaluate(){
  const [i,j,k]=selected, cards=[board[i],board[j],board[k]];
  if(isSet(...cards)){
    locked=true; score++; document.getElementById('score').textContent=score;
    // אפקט יציאה מדורג (סיבוב + התכווצות) לשלושת הקלפים
    const nodes=document.querySelectorAll('.card');
    const slots=[...selected].sort((a,b)=>a-b);
    slots.forEach((idx,k)=>{ const el=nodes[idx]; if(el){ el.style.animationDelay=(k*0.08)+'s'; el.classList.add('matched'); } });
    const wasReplace = board.length<=12;
    setTimeout(()=>{
      let enter=null;
      if(!wasReplace){
        [...slots].sort((a,b)=>b-a).forEach(idx=>board.splice(idx,1));
      }else{
        slots.forEach(idx=>{ board[idx]= deck.length? deck.pop() : null; });
        const hadNull=board.includes(null);
        board=board.filter(Boolean);
        enter = hadNull ? null : new Set(slots);
      }
      selected=[]; locked=false;
      render(enter);
      // השהיית כניסה מדורגת
      if(enter){ const cs=document.querySelectorAll('.card'); [...enter].sort((a,b)=>a-b).forEach((idx,k)=>{ const el=cs[idx]; if(el) el.style.animationDelay=(k*0.08)+'s'; }); }
      toast('סט! נמצא','ok'); checkGameOver();
    }, 660);
  }else{
    locked=true; markCards(selected,'bad');
    setTimeout(()=>{ selected=[]; locked=false; render(); },430);
  }
}
function markCards(idxs,cls){ const nodes=document.querySelectorAll('.card'); idxs.forEach(i=>nodes[i]&&nodes[i].classList.add(cls)); }

/* -------- "אין סט": מוסיף רק אם באמת אין סט -------- */
function onNoSet(){
  if(locked) return;
  if(!started) startClock();
  if(findSet(board)){ toast('קיים סט — המשיכו לחפש','warn'); return; }
  if(deck.length===0){ checkGameOver(); return; }
  const add=Math.min(3,deck.length);
  for(let n=0;n<add;n++) board.push(deck.pop());
  selected=[]; render(); toast('לא נמצא סט — נוספו 3 קלפים');
}
function hint(){
  if(locked) return;
  const s=findSet(board);
  if(!s){ toast('אין סט על הלוח — לחצו "אין סט"','warn'); return; }
  const one=document.querySelectorAll('.card')[s[0]];
  if(one){ one.classList.add('hint'); setTimeout(()=>one.classList.remove('hint'),1200); }
}
function checkGameOver(){
  if(deck.length===0 && !findSet(board)){
    stopClock();
    let newRecord=false;
    if(score>0 && (best==null || seconds<best)){ best=seconds; newRecord=true; saveBest(); updateBest(); }
    document.getElementById('mScore').textContent=score;
    document.getElementById('mTime').textContent=fmt(seconds);
    document.getElementById('mTitle').textContent= score>0 ? 'סיימתם!' : 'נגמר';
    document.getElementById('mRecord').style.display = newRecord ? 'block' : 'none';
    document.getElementById('overlay').classList.add('show');
    if(score>0) confettiBurst();
  }
}

/* -------- שיא זמן שמור -------- */
let best=null;
function loadBest(){ try{ const v=localStorage.getItem('set_best_time'); best = v!=null ? parseInt(v,10) : null; }catch(e){ best=null; } updateBest(); }
function saveBest(){ try{ localStorage.setItem('set_best_time', String(best)); }catch(e){} }
function updateBest(){ const el=document.getElementById('best'); if(el) el.textContent = best!=null ? fmt(best) : '—'; }
function confettiBurst(){
  const c=document.getElementById('confetti'); if(!c) return;
  const ctx=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight; c.classList.add('on');
  const cols=['#E12D22','#7D2CB5','#1E9E48','#F2C230','#EE7B30','#E84B8A','#2F8378','#7BDBC9'];
  let parts=[];
  const launch=(cx,cy,ang)=>{ for(let i=0;i<70;i++){ const a=ang+(Math.random()-.5)*0.9, sp=8+Math.random()*9;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.26+Math.random()*0.08,
      s:6+Math.random()*7,rot:Math.random()*6.28,vr:(Math.random()-.5)*0.5,
      col:cols[Math.random()*cols.length|0],life:0}); } };
  launch(innerWidth*0.5, innerHeight*0.62, -Math.PI/2);
  launch(innerWidth*0.12, innerHeight, -Math.PI/2.6);
  launch(innerWidth*0.88, innerHeight, -Math.PI/1.63);
  const t0=performance.now();
  (function frame(now){
    ctx.clearRect(0,0,c.width,c.height); let alive=false;
    for(const p of parts){
      p.vy+=p.g; p.vx*=0.995; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
      if(p.y<c.height+30) alive=true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha=Math.max(0,1-(p.life-140)/70); ctx.fillStyle=p.col;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); ctx.restore();
    }
    if(now-t0<3600 && alive) requestAnimationFrame(frame);
    else{ ctx.clearRect(0,0,c.width,c.height); c.classList.remove('on'); }
  })(t0);
}

/* -------- פלטה -------- */
function applyPalette(){
  const p=PALETTES[paletteIndex], r=document.documentElement.style;
  r.setProperty('--page',p.page); r.setProperty('--ink',p.ink); r.setProperty('--ink-soft',p.inkSoft);
  r.setProperty('--line',p.line); r.setProperty('--accent',p.accent);
}
function dotsHTML(p){ return p.colors.map(c=>`<i style="background:${c}"></i>`).join(''); }
function updateCurDots(){ const el=document.getElementById('curDots'); if(el) el.innerHTML=dotsHTML(PALETTES[paletteIndex]); }
function buildPaletteBar(){
  const menu=document.getElementById('palMenu');
  PALETTES.forEach((p,i)=>{
    const chip=document.createElement('button');
    chip.className='pchip'+(i===paletteIndex?' active':'');
    chip.innerHTML=`<span class="dots">${dotsHTML(p)}</span>${p.name}`;
    chip.onclick=()=>{
      paletteIndex=i;
      document.querySelectorAll('.pchip').forEach(c=>c.classList.remove('active')); chip.classList.add('active');
      applyPalette(); render(); updateCurDots();
      document.getElementById('paletteWrap').classList.remove('open');
    };
    menu.appendChild(chip);
  });
  updateCurDots();
  const wrap=document.getElementById('paletteWrap'), toggle=document.getElementById('palToggle');
  toggle.onclick=(e)=>{ e.stopPropagation(); wrap.classList.toggle('open'); toggle.setAttribute('aria-expanded', wrap.classList.contains('open')); };
  document.addEventListener('click',(e)=>{ if(!wrap.contains(e.target)) wrap.classList.remove('open'); });
}

/* -------- משחק חדש -------- */
function newGame(){
  stopClock();
  deck=buildDeck(); board=[]; selected=[]; score=0; seconds=0; started=false; locked=false;
  for(let n=0;n<12;n++) board.push(deck.pop());
  document.getElementById('clock').textContent='0:00';
  document.getElementById('overlay').classList.remove('show');
  applyPalette(); render();
}

/* -------- הודעות -------- */
let toastT=null;
function toast(msg,type=''){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',1900); }

/* -------- חיווט -------- */
document.getElementById('noset').onclick=onNoSet;
document.getElementById('hint').onclick=hint;
document.getElementById('reset').onclick=newGame;
document.getElementById('mAgain').onclick=newGame;
window.addEventListener('resize', layoutBoard);
buildPaletteBar();
loadBest();
newGame();
</script>
